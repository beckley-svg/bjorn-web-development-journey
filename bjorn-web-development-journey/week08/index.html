<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Three Flexbox Cards</h1>

        <section class="cards">
            <article class="card">
                <h2>HTML</h2>
                <p>HTML gives a webpage its structure.</p>
            </article>

            <article class="card">
                <h2>CSS</h2>
                <p>CSS controls the appearance of a webpage.</p>
            </article>

            <article class="card">
                <h2>JavaScript</h2>
                <p>JavaScript adds interaction to a webpage.</p>
            </article>
        </section>
    </main>
</body>
</html>
