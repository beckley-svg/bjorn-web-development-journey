<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <h1>CSS Box Model Practice</h1>

        <article class="card">
            <h2>Margin</h2>
            <p>Margin creates space outside an element.</p>
        </article>

        <article class="card">
            <h2>Padding</h2>
            <p>Padding creates space inside an element around its content.</p>
        </article>

        <article class="card">
            <h2>Border</h2>
            <p>A border sits between the padding and margin.</p>
        </article>
    </main>
</body>
</html>
