<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Question Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="quiz">
        <h1>Web Basics Quiz</h1>

        <div id="questionBox">
            <h2 id="question"></h2>
            <div id="answers"></div>
        </div>

        <p id="result"></p>
        <button id="restart" hidden>Restart Quiz</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
