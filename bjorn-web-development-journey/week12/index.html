<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Input Practice</title>
</head>
<body>
    <h1>Simple Form</h1>

    <label for="name">Name:</label>
    <input id="name" type="text">

    <label for="favourite">Favourite subject:</label>
    <input id="favourite" type="text">

    <button id="submitButton">Show message</button>
    <button id="clearButton">Clear</button>

    <p id="message"></p>

    <script src="script.js"></script>
</body>
</html>
